<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Ley 3/2001 Gobierno y Administración CyL (T. Prel., I, II y III)</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Ley 3/2001, del Gobierno y de la Administración de la Comunidad de Castilla y León (Título Preliminar y Títulos I, II y III)</h1>
      <p>50 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 50</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según su artículo 1, la Ley 3/2001, de 3 de julio, tiene por objeto:", "o": ["La regulación de la organización y funcionamiento del Gobierno y de la Administración de la Comunidad de Castilla y León", "La regulación del procedimiento administrativo común en la Comunidad de Castilla y León", "La regulación del régimen jurídico del personal al servicio de la Administración de la Comunidad", "La regulación de la organización y funcionamiento de las Cortes de Castilla y León"], "c": 0, "w": "Art. 1: la Ley tiene por objeto la regulación de la organización y funcionamiento del Gobierno y de la Administración de la Comunidad de Castilla y León."}, {"d": "Fácil", "q": "De acuerdo con el artículo 2.1, la Junta de Castilla y León, bajo la dirección de su Presidente, es:", "o": ["El órgano de gobierno y el supremo órgano consultivo de la Comunidad", "El órgano legislativo y de gobierno de la Comunidad", "El órgano de gobierno y el supremo órgano de administración de la Comunidad", "El órgano de administración ordinaria, subordinado a las Cortes de Castilla y León"], "c": 2, "w": "Art. 2.1: la Junta, bajo la dirección de su Presidente, es el órgano de gobierno y el supremo órgano de administración de la Comunidad de Castilla y León."}, {"d": "Fácil", "q": "Según el artículo 2.2, la Junta de Castilla y León ejerce, de acuerdo con la Constitución, el Estatuto de Autonomía y las leyes:", "o": ["La función ejecutiva y la potestad reglamentaria", "Únicamente la función ejecutiva, correspondiendo la potestad reglamentaria a las Cortes", "La potestad reglamentaria y la potestad jurisdiccional", "La función legislativa y la función ejecutiva"], "c": 0, "w": "Art. 2.2: la Junta dirige la política y la Administración y ejerce la función ejecutiva y la potestad reglamentaria de acuerdo con la Constitución, el Estatuto de Autonomía y las leyes."}, {"d": "Medio", "q": "A los efectos de la Ley 3/2001, la Administración de la Comunidad de Castilla y León se integra por:", "o": ["La Administración General y las entidades locales de la Comunidad", "La Administración General y la Administración Institucional", "La Administración General, la Administración Institucional y las empresas públicas", "La Administración central y la Administración periférica"], "c": 1, "w": "Art. 3.2: a los efectos de la Ley, la Administración de la Comunidad se integra por la Administración General y por la Administración Institucional."}, {"d": "Medio", "q": "Según el artículo 4, el Presidente de la Junta de Castilla y León ostenta:", "o": ["La ordinaria representación de la Comunidad Autónoma y la suprema del Estado en ésta", "La suprema representación de la Comunidad Autónoma, sin representación alguna del Estado", "La suprema representación de la Comunidad Autónoma y la ordinaria del Estado en ésta", "La representación extraordinaria del Estado en la Comunidad y la ordinaria de ésta"], "c": 2, "w": "Art. 4: el Presidente ostenta la suprema representación de la Comunidad Autónoma y la ordinaria del Estado en ésta; además preside la Junta, dirige sus acciones y coordina las funciones de sus miembros."}, {"d": "Fácil", "q": "El Presidente de la Junta de Castilla y León será elegido en la forma prevista en el Estatuto de Autonomía y nombrado por:", "o": ["El Presidente de las Cortes de Castilla y León", "El Rey", "El Presidente del Gobierno de la Nación", "El Pleno de las Cortes de Castilla y León"], "c": 1, "w": "Art. 5: el Presidente será elegido en la forma prevista en el Estatuto de Autonomía y nombrado por el Rey."}, {"d": "Fácil", "q": "Entre las atribuciones básicas del Presidente de la Junta recogidas en el artículo 6 figura:", "o": ["Aprobar el Proyecto de Ley de Presupuestos de la Comunidad", "Convocar elecciones a las Cortes de Castilla y León de acuerdo con lo establecido en el Estatuto de Autonomía", "Aprobar la estructura orgánica de la Administración de la Comunidad", "Declarar la urgencia en materia de expropiación forzosa"], "c": 1, "w": "Art. 6.1: corresponde al Presidente convocar elecciones a las Cortes de Castilla y León. Las otras opciones son atribuciones de la Junta (art. 16 c), k) y q))."}, {"d": "Medio", "q": "¿Cuál de las siguientes es una atribución básica del Presidente de la Junta según el artículo 6?", "o": ["Resolver los recursos en vía administrativa en los casos previstos por las Leyes", "Aprobar y remitir los Proyectos de Ley a las Cortes de Castilla y León", "Promulgar, en nombre del Rey, las Leyes aprobadas por las Cortes de Castilla y León", "Dictar Decretos Legislativos en los términos del artículo 16.3 del Estatuto"], "c": 2, "w": "Art. 6.3: el Presidente promulga, en nombre del Rey, las Leyes aprobadas por las Cortes, ordena su publicación en el BOCYL y su remisión para publicación en el BOE. Las demás opciones son atribuciones de la Junta (art. 16 a), b) y m))."}, {"d": "Medio", "q": "Para plantear ante las Cortes de Castilla y León la cuestión de confianza, el Presidente necesita:", "o": ["La previa autorización de la Mesa de las Cortes de Castilla y León", "La previa deliberación de la Junta de Castilla y León", "El previo dictamen del Consejo Consultivo de Castilla y León", "El previo acuerdo de la Comisión de Secretarios Generales"], "c": 1, "w": "Art. 6.6 y art. 16 f): el Presidente plantea la cuestión de confianza previa deliberación de la Junta, a la que corresponde deliberar sobre ella con carácter previo a su planteamiento."}, {"d": "Fácil", "q": "Cuando el Presidente nombra o separa libremente a los demás miembros de la Junta, debe:", "o": ["Obtener la ratificación del Rey", "Comunicarlo seguidamente a las Cortes de Castilla y León", "Someterlo a la deliberación previa del Consejo de Gobierno", "Obtener la previa aprobación de las Cortes de Castilla y León"], "c": 1, "w": "Art. 7.2: corresponde al Presidente nombrar y separar libremente a los demás miembros de la Junta, comunicándolo seguidamente a las Cortes de Castilla y León."}, {"d": "Medio", "q": "En caso de vacante, ausencia o enfermedad del titular de una Consejería, encomendar a otro miembro de la Junta el despacho de sus asuntos corresponde a:", "o": ["La Junta de Castilla y León reunida en Consejo de Gobierno", "El Secretario general de la Consejería afectada", "El Vicepresidente primero, si lo hubiere", "El Presidente de la Junta"], "c": 3, "w": "Art. 7.4: corresponde al Presidente encomendar a otro miembro de la Junta el despacho de los asuntos de una Consejería en caso de vacante, ausencia o enfermedad de su titular."}, {"d": "Medio", "q": "Resolver los conflictos de atribuciones entre las distintas Consejerías corresponde a:", "o": ["El Presidente de la Junta", "El Consejero que suscite el conflicto", "La Junta de Castilla y León", "La Comisión de Secretarios Generales"], "c": 0, "w": "Art. 7.9: corresponde al Presidente asegurar la coordinación entre las distintas Consejerías y resolver los conflictos de atribuciones entre las mismas."}, {"d": "Medio", "q": "Según el artículo 7, corresponde al Presidente de la Junta crear, modificar o suprimir:", "o": ["Comisiones Delegadas del Consejo de Gobierno", "Consejerías y Viceconsejerías, determinando el ámbito material de las Consejerías", "Delegaciones Territoriales y Servicios Territoriales", "Secretarías Generales y Direcciones Generales"], "c": 1, "w": "Art. 7.12 y 7.13: el Presidente puede crear, modificar o suprimir Consejerías, determinando su ámbito material de actividad, y Viceconsejerías para un sector de actividad administrativa concreto."}, {"d": "Fácil", "q": "El Gabinete del Presidente de la Junta se configura como:", "o": ["Un órgano de asesoramiento cuyo personal es nombrado por la Junta a propuesta del Presidente", "Un órgano directivo central con rango de Dirección General", "Un órgano colegiado de deliberación, integrado por los Consejeros", "Un órgano de asesoramiento y apoyo, cuyo personal eventual nombra y cesa libremente el Presidente"], "c": 3, "w": "Art. 8: el Presidente podrá contar con un Gabinete como órgano de asesoramiento y apoyo, cuyo personal eventual será nombrado y cesado libremente por él (también art. 7.5)."}, {"d": "Medio", "q": "Las atribuciones del Presidente de la Junta podrán ser delegadas:", "o": ["Únicamente en los Vicepresidentes, por su orden", "En ningún caso, al ser atribuciones personalísimas", "Libremente en cualquier miembro de la Junta, previa autorización de las Cortes", "En los términos establecidos en el Estatuto de Autonomía y en la Ley 3/2001"], "c": 3, "w": "Art. 9: las atribuciones del Presidente podrán ser delegadas en los términos establecidos en el Estatuto de Autonomía y en la presente Ley."}, {"d": "Alto", "q": "Respecto de los actos celebrados en Castilla y León a los que concurra, el Presidente de la Junta:", "o": ["Los presidirá solo si no asiste el Presidente de las Cortes de Castilla y León", "Los presidirá en todo caso, por ostentar la suprema representación de la Comunidad", "Los presidirá únicamente cuando hayan sido organizados por la Junta de Castilla y León", "Los presidirá, salvo que la Presidencia corresponda por Ley a otra autoridad o a representación superior del Estado presente en el acto"], "c": 3, "w": "Art. 10.1: el Presidente presidirá los actos celebrados en Castilla y León a los que concurra, salvo que la Presidencia corresponda por Ley a otra autoridad o a representación superior del Estado presente en el acto."}, {"d": "Fácil", "q": "La retribución y los gastos de representación del Presidente de la Junta se fijarán en:", "o": ["Una Orden de la Consejería competente en materia de Hacienda", "Los Presupuestos de la Comunidad", "Un Decreto de la Junta de Castilla y León", "El Reglamento de las Cortes de Castilla y León"], "c": 1, "w": "Art. 10.2: en los Presupuestos de la Comunidad se fijarán la retribución y los gastos de representación del Presidente de la Junta."}, {"d": "Medio", "q": "El cargo de Presidente de la Junta es incompatible con cualquier función pública que no derive de su condición de Procurador en Cortes o de su cargo, con la excepción de la de:", "o": ["Alcalde", "Diputado provincial", "Diputado en el Congreso", "Senador"], "c": 3, "w": "Art. 11: el cargo es incompatible con toda actividad profesional o mercantil y con cualquier otra función pública que no derive de su condición de Procurador o de su cargo, a excepción de la de Senador."}, {"d": "Medio", "q": "¿Cuál de las siguientes NO es una causa de cese del Presidente de la Junta según el artículo 12?", "o": ["La incapacidad permanente declarada por la Junta de Castilla y León", "La sentencia firme que le inhabilite para el desempeño del cargo", "La pérdida de la cuestión de confianza", "La pérdida de la condición de Procurador en las Cortes de Castilla y León"], "c": 0, "w": "Art. 12.1: son causas de cese la celebración de elecciones, la moción de censura, la pérdida de la cuestión de confianza, la dimisión, el fallecimiento, la pérdida de la condición de Procurador y la sentencia firme de inhabilitación. La incapacidad declarada por la Junta no figura."}, {"d": "Medio", "q": "¿En cuál de los siguientes supuestos de cese el Presidente cesante continúa en funciones hasta la toma de posesión del nuevo Presidente?", "o": ["Sentencia firme que le inhabilite para el cargo", "Pérdida de la condición de Procurador en las Cortes", "Fallecimiento", "Aprobación de una moción de censura"], "c": 3, "w": "Art. 12.2: en los supuestos a) elecciones, b) moción de censura, c) pérdida de la cuestión de confianza y d) dimisión, el Presidente cesante continuará en funciones hasta la toma de posesión del nuevo Presidente."}, {"d": "Medio", "q": "Si el Presidente cesa por fallecimiento y no existen Vicepresidentes, será sustituido hasta la toma de posesión del nuevo Presidente por:", "o": ["El Consejero más joven, que actúa como Secretario de la Junta", "El Consejero que designen las Cortes de Castilla y León", "El Consejero más antiguo y, en caso de igualdad, por el de mayor edad", "El Consejero de mayor edad"], "c": 2, "w": "Art. 12.2: en los supuestos de fallecimiento e inhabilitación, el Presidente será sustituido por uno de los Vicepresidentes según su orden y, en otro caso, por el Consejero más antiguo y, en caso de igualdad, por el de mayor edad."}, {"d": "Alto", "q": "Si el Presidente que ha dimitido, estando en funciones, accede a un cargo público incompatible con el desempeño de la Presidencia:", "o": ["La Junta cesará de forma inmediata sin continuar en funciones", "Será sustituido por el Consejero que él mismo designe expresamente", "Será sustituido por un Vicepresidente según su orden o, en su defecto, por el Consejero más antiguo y, en igualdad, por el de mayor edad", "Continuará en funciones hasta la toma de posesión del nuevo Presidente, sin perjuicio de la incompatibilidad"], "c": 2, "w": "Art. 12.2, último párrafo: cuando en el supuesto de dimisión el Presidente en funciones accediera a un cargo público incompatible, será sustituido en la forma prevista para el fallecimiento y la inhabilitación (Vicepresidentes por su orden; en otro caso, Consejero más antiguo y, en igualdad, el de mayor edad)."}, {"d": "Alto", "q": "En los casos de ausencia, vacante o enfermedad del Presidente de la Junta (art. 13):", "o": ["Será sustituido por el Consejero que designe la Junta en Consejo de Gobierno", "Será sustituido siempre por el Vicepresidente primero, sin posibilidad de designación expresa", "Será sustituido siguiendo el orden del artículo 12, salvo que el Presidente designe expresamente a otro miembro de la Junta", "Será sustituido por el Consejero de mayor edad, salvo que las Cortes acuerden otra cosa"], "c": 2, "w": "Art. 13: en los casos de ausencia, vacante o enfermedad, el Presidente será sustituido siguiendo el orden establecido en el último párrafo del art. 12, salvo que designe expresamente a otro miembro de la Junta."}, {"d": "Alto", "q": "Respecto del régimen de los ex Presidentes de la Junta, el artículo 14 establece que su tratamiento y atenciones honoríficas:", "o": ["Se determinarán reglamentariamente para quienes hayan cesado por elecciones, moción de censura, pérdida de la cuestión de confianza o dimisión", "Se fijarán por Decreto del Presidente en ejercicio para quienes hayan cesado por cualquier causa", "Se fijarán en la Ley de Presupuestos para todos los ex Presidentes, cualquiera que sea la causa del cese", "Se determinarán reglamentariamente para todos, incluidos los inhabilitados por sentencia firme"], "c": 0, "w": "Art. 14: el tratamiento y las atenciones honoríficas de los Presidentes que hayan cesado por las causas de las letras a), b), c) y d) del art. 12 (elecciones, moción de censura, cuestión de confianza y dimisión) se determinarán reglamentariamente."}, {"d": "Fácil", "q": "La Junta de Castilla y León se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de:", "o": ["Un máximo de doce Consejeros", "Un mínimo de diez Consejeros", "Un máximo de diez Consejeros", "Un máximo de ocho Consejeros"], "c": 2, "w": "Art. 15: la Junta se compone del Presidente, del Vicepresidente o Vicepresidentes, en su caso, y de un máximo de diez Consejeros."}, {"d": "Fácil", "q": "Dictar Decretos Legislativos en los términos previstos en el artículo 16.3 del Estatuto de Autonomía es atribución de:", "o": ["La Junta de Castilla y León", "El Presidente de la Junta", "El Consejero competente por razón de la materia", "Las Cortes de Castilla y León"], "c": 0, "w": "Art. 16 b): es atribución de la Junta dictar Decretos Legislativos en los términos previstos en el art. 16.3 del Estatuto de Autonomía."}, {"d": "Medio", "q": "En materia de potestad reglamentaria, a la Junta de Castilla y León le corresponde ejercerla, en general:", "o": ["Únicamente cuando lo autoricen expresamente las Cortes", "En todos los casos en que no esté atribuida al Presidente o a los Consejeros", "Solo para el desarrollo de la legislación básica del Estado", "Solo en materias que afecten a más de una Consejería"], "c": 1, "w": "Art. 16 e): la Junta aprueba los reglamentos de desarrollo y ejecución de las leyes de las Cortes y de la legislación básica del Estado y ejerce, en general, la potestad reglamentaria en todos los casos en que no esté atribuida al Presidente o a los Consejeros."}, {"d": "Alto", "q": "La Junta de Castilla y León puede acordar la interposición de recursos de inconstitucionalidad y la personación ante el Tribunal Constitucional:", "o": ["Por propia iniciativa, previa autorización del Presidente del Gobierno", "Por acuerdo de las Cortes de Castilla y León o por propia iniciativa", "Únicamente a propuesta del Consejo Consultivo de Castilla y León", "Únicamente por acuerdo de las Cortes de Castilla y León"], "c": 1, "w": "Art. 16 g): corresponde a la Junta acordar la interposición de recursos de inconstitucionalidad, el planteamiento de conflictos de competencia y la personación ante el Tribunal Constitucional, por acuerdo de las Cortes o por propia iniciativa."}, {"d": "Alto", "q": "Las directrices que la Junta apruebe para las fundaciones y empresas públicas tendrán carácter vinculante:", "o": ["Siempre que se publiquen en el Boletín Oficial de Castilla y León", "Siempre que sean refrendadas por los órganos societarios o de la fundación competentes", "Desde su aprobación por la Junta, sin necesidad de otro requisito", "Cuando las ratifique el Consejero al que estén adscritas"], "c": 1, "w": "Art. 16 j): la Junta podrá aprobar directrices para las fundaciones y empresas públicas, que pasarán a tener carácter vinculante siempre que sean refrendadas por los órganos societarios o de la fundación competentes."}, {"d": "Medio", "q": "El nombramiento y cese de los cargos con categoría igual, superior o asimilable a la de Director General corresponde a:", "o": ["El Consejero correspondiente, dando cuenta a la Junta", "El Presidente de la Junta, comunicándolo a las Cortes", "La Junta de Castilla y León, a propuesta del Consejero correspondiente", "La Junta de Castilla y León, a propuesta de la Comisión de Secretarios Generales"], "c": 2, "w": "Art. 16 l): es atribución de la Junta nombrar y cesar los cargos con categoría igual, superior o asimilable a la de Director General, a propuesta del Consejero correspondiente."}, {"d": "Alto", "q": "Cuando un contrato afecte a varias Consejerías, determinar el órgano de contratación corresponde a:", "o": ["La Comisión de Secretarios Generales", "El Presidente de la Junta", "El Consejero que tenga mayor participación en el gasto", "La Junta de Castilla y León"], "c": 3, "w": "Art. 16 o): es atribución de la Junta autorizar la celebración de contratos en los supuestos legales y determinar el órgano de contratación cuando afecten a varias Consejerías."}, {"d": "Fácil", "q": "Para el ejercicio de las atribuciones de la Junta, sus miembros se reúnen en:", "o": ["Pleno y Comisiones Informativas", "Consejo de Gobierno y Comisiones Delegadas", "Pleno y Comisiones de Secretarios Generales", "Consejo de Gobierno y Consejos de Dirección"], "c": 1, "w": "Art. 17: para el ejercicio de las atribuciones de la Junta, sus miembros se reúnen en Consejo de Gobierno y en Comisiones Delegadas."}, {"d": "Medio", "q": "Para la constitución del Consejo de Gobierno y la válida adopción de acuerdos es necesaria la presencia de:", "o": ["El Presidente o quien le sustituya y, al menos, dos tercios de los Consejeros", "La mitad más uno de los Consejeros, aunque no asista el Presidente", "El Presidente y la mayoría absoluta de los miembros de la Junta", "El Presidente o quien legalmente le sustituya y, al menos, la mitad de los Consejeros"], "c": 3, "w": "Art. 18.2: es necesaria la presencia del Presidente o de quien legalmente le sustituya y de, al menos, la mitad de los Consejeros."}, {"d": "Fácil", "q": "Según el artículo 18.3, las deliberaciones del Consejo de Gobierno:", "o": ["Serán públicas, salvo acuerdo en contrario", "Serán públicas", "Serán secretas", "Se publicarán en el Boletín Oficial de Castilla y León"], "c": 2, "w": "Art. 18.3: las deliberaciones del Consejo de Gobierno serán secretas."}, {"d": "Medio", "q": "Las actas de los acuerdos del Consejo de Gobierno las levanta un Consejero nombrado Secretario de la Junta por el Presidente. En caso de ausencia del Secretario, será sustituido por:", "o": ["El Consejero más joven", "El Consejero de mayor edad", "El Consejero más antiguo", "El Portavoz de la Junta"], "c": 0, "w": "Art. 18.4: los acuerdos constarán en acta que levantará un Consejero nombrado Secretario de la Junta por su Presidente; en caso de ausencia, el Secretario será sustituido por el Consejero más joven."}, {"d": "Medio", "q": "Sobre la asistencia de funcionarios o expertos a las reuniones del Consejo de Gobierno, es correcto que:", "o": ["Requiere autorización del Presidente, su presencia se limita al tiempo en que hayan de informar y deben guardar secreto", "Requiere acuerdo previo del Consejo de Gobierno y no están obligados a guardar secreto", "Solo pueden asistir los Secretarios Generales de las Consejerías", "Pueden asistir a toda la sesión con voz pero sin voto"], "c": 0, "w": "Art. 18.5: podrán asistir funcionarios o expertos cuya asistencia autorice el Presidente; su presencia se limita al tiempo en que hayan de informar y están obligados a guardar secreto sobre la parte de la sesión a la que hayan tenido acceso."}, {"d": "Medio", "q": "Las Comisiones Delegadas del Consejo de Gobierno:", "o": ["Se rigen por criterios de funcionamiento distintos a los del Consejo de Gobierno", "Las constituye el Presidente y solo pueden tener carácter temporal", "Pueden ser permanentes o temporales y se constituyen, entre otros fines, para preparar asuntos que afecten a dos o más Consejerías", "Son siempre permanentes y se crean por Ley de las Cortes de Castilla y León"], "c": 2, "w": "Art. 19.1: el Consejo de Gobierno podrá acordar la constitución de Comisiones Delegadas permanentes o temporales para preparar asuntos que afecten a dos o más Consejerías, elaborar directrices, programas o actuaciones de interés común y estudiar otras cuestiones; su funcionamiento se rige por los mismos criterios que el Consejo de Gobierno."}, {"d": "Alto", "q": "El Decreto de creación de las Comisiones Delegadas deberá contener, al menos:", "o": ["La presidencia, el secretario y el régimen de incompatibilidades de sus miembros", "Los miembros de la Junta y, en su caso, el resto de componentes, la presidencia y las funciones asignadas", "Los miembros de la Junta, su duración máxima y el informe de las Cortes", "Su sede, su presupuesto y su régimen de sesiones"], "c": 1, "w": "Art. 19.2: el Decreto de creación deberá contener, al menos, los miembros de la Junta y, en su caso, el resto de componentes que las integren, la presidencia y las funciones que se les asignen."}, {"d": "Fácil", "q": "La Comisión formada por los Secretarios Generales de las distintas Consejerías tiene como misión:", "o": ["Controlar la acción política de la Junta", "Aprobar los anteproyectos de presupuesto de las Consejerías", "Resolver los conflictos de atribuciones entre Consejerías", "Realizar las tareas preparatorias de las reuniones del Consejo de Gobierno"], "c": 3, "w": "Art. 20: el Consejo de Gobierno estará asistido por una Comisión formada por los Secretarios Generales de las distintas Consejerías para la realización de las tareas preparatorias de sus reuniones."}, {"d": "Alto", "q": "La Presidencia de la Comisión de Secretarios Generales y sus normas de funcionamiento se establecerán:", "o": ["Por Decreto de la Junta de Castilla y León", "Directamente por la Ley 3/2001, que atribuye la presidencia al Secretario general más antiguo", "Por Decreto del Presidente de la Junta", "Por Orden de la Consejería de la Presidencia"], "c": 0, "w": "Art. 20, párrafo segundo: la Presidencia de dicha Comisión, así como sus normas de funcionamiento, se establecerán por Decreto de la Junta de Castilla y León."}, {"d": "Medio", "q": "Según el artículo 21.1, ante las Cortes de Castilla y León:", "o": ["Cada Consejero responde individualmente, sin responsabilidad solidaria de la Junta", "La Junta responde solidariamente, quedando excluida la responsabilidad individual de los Consejeros", "El Presidente y la Junta responden solidariamente, sin perjuicio de la responsabilidad directa de cada Consejero por su gestión", "Solo responde el Presidente; los Consejeros responden únicamente ante él"], "c": 2, "w": "Art. 21.1: el Presidente y la Junta responden solidariamente ante las Cortes, sin perjuicio de la responsabilidad directa de cada Consejero por su gestión."}, {"d": "Medio", "q": "La Junta de Castilla y León en funciones, tras el cese de su Presidente, en ningún caso podrá:", "o": ["Aprobar el Proyecto de Ley de Presupuestos ni presentar Proyectos de Ley a las Cortes", "Adoptar medidas en casos de urgencia", "Despachar los asuntos públicos ordinarios", "Adoptar medidas por razones de interés general"], "c": 0, "w": "Art. 22.2: la Junta en funciones limita su gestión al despacho ordinario (salvo urgencia o interés general) y en ningún caso podrá aprobar el Proyecto de Ley de Presupuestos ni presentar Proyectos de Ley a las Cortes."}, {"d": "Medio", "q": "Respecto de los Vicepresidentes, el artículo 23.1 establece que el Presidente:", "o": ["Debe nombrar obligatoriamente al menos un Vicepresidente, previa conformidad de las Cortes", "Podrá nombrarlos libremente, pero su separación requiere acuerdo de la Junta", "Podrá nombrar como máximo dos Vicepresidentes, a propuesta de la Junta", "Podrá nombrar y separar libremente uno o más, indicando su orden si son varios y comunicándolo inmediatamente a las Cortes"], "c": 3, "w": "Art. 23.1: el Presidente podrá nombrar y separar libremente uno o más Vicepresidentes, indicando en este último caso su orden y comunicándolo inmediatamente a las Cortes de Castilla y León."}, {"d": "Medio", "q": "El Vicepresidente que asuma la titularidad de una Consejería:", "o": ["Necesitará la autorización de las Cortes para acumular ambos cargos", "Perderá la condición de Vicepresidente mientras sea titular de la Consejería", "No computará a efectos del número de miembros de la Junta", "Ostentará además la condición de Consejero"], "c": 3, "w": "Art. 23.2: el Vicepresidente o Vicepresidentes que asuman la titularidad de una Consejería ostentarán además la condición de Consejeros."}, {"d": "Medio", "q": "Los Consejeros inician su mandato:", "o": ["En el momento de su toma de posesión ante el Pleno de las Cortes", "En el momento de la publicación de su nombramiento en el BOCYL", "Cuando las Cortes toman conocimiento de su nombramiento", "En el momento de su toma de posesión ante el Presidente de la Junta"], "c": 3, "w": "Art. 25: los Consejeros son nombrados y separados libremente por el Presidente, que lo comunica a las Cortes, e inician su mandato en el momento de su toma de posesión ante el Presidente de la Junta."}, {"d": "Alto", "q": "¿Cuál de las siguientes es una atribución de los Consejeros según el artículo 26?", "o": ["Resolver los conflictos de atribuciones entre los órganos directivos de su Consejería y suscitarlos con otras Consejerías", "Resolver los conflictos de atribuciones entre las distintas Consejerías", "Aprobar la estructura orgánica de la Administración de la Comunidad", "Nombrar y cesar a los Directores Generales de su Consejería"], "c": 0, "w": "Art. 26.1 i): los Consejeros resuelven los conflictos de atribuciones entre los órganos directivos de su Consejería y los suscitan con otras. Los conflictos entre Consejerías los resuelve el Presidente (art. 7.9); los Directores Generales los nombra la Junta (art. 16 l); y la estructura orgánica la aprueba la Junta (art. 16 k)."}, {"d": "Medio", "q": "Los Consejeros pueden celebrar contratos en materias propias de la competencia de su Consejería:", "o": ["Con el límite fijado en las Leyes de Presupuestos de la Comunidad", "Solo previa autorización de la Junta en todo caso", "Con el límite que fije el Presidente de la Junta mediante Decreto", "Sin límite de cuantía alguno"], "c": 0, "w": "Art. 26.1 k): los Consejeros celebran los contratos en materias propias de su Consejería, con el límite fijado en las Leyes de Presupuestos de la Comunidad."}, {"d": "Fácil", "q": "En materia de incompatibilidades, los Vicepresidentes y los Consejeros:", "o": ["Tienen el régimen de incompatibilidades de los funcionarios de carrera", "Están sujetos a las mismas incompatibilidades que el Presidente de la Junta", "Solo son incompatibles con el ejercicio de actividades mercantiles", "No tienen régimen de incompatibilidades específico"], "c": 1, "w": "Art. 28: los Vicepresidentes y los Consejeros están sujetos a las mismas incompatibilidades que el Presidente de la Junta."}, {"d": "Alto", "q": "¿Cuál de las siguientes NO es una causa de cese de los Vicepresidentes y Consejeros según el artículo 29?", "o": ["La pérdida de la condición de Procurador en las Cortes de Castilla y León", "La revocación de su nombramiento decidida libremente por el Presidente", "La dimisión aceptada por el Presidente", "La sentencia firme que le inhabilite para el desempeño del cargo"], "c": 0, "w": "Art. 29: cesan por cese del Presidente (continuando en funciones), dimisión aceptada por el Presidente, revocación decidida libremente por éste, fallecimiento y sentencia firme de inhabilitación. La pérdida de la condición de Procurador solo es causa de cese del Presidente (art. 12.1 f)."}, {"d": "Medio", "q": "En caso de ausencia, vacante o enfermedad, los Vicepresidentes y los Consejeros serán sustituidos en el ejercicio de sus funciones por:", "o": ["El Viceconsejero o, en su defecto, el Director General más antiguo", "El Secretario general de la Consejería correspondiente", "Otro miembro de la Junta designado por el Presidente", "El Consejero más antiguo y, en caso de igualdad, el de mayor edad"], "c": 2, "w": "Art. 30: en caso de ausencia, vacante o enfermedad, los Vicepresidentes y los Consejeros serán sustituidos por otro miembro de la Junta designado por el Presidente."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Ley_3_2001_Gobierno_CyL.doc"; document.body.appendChild(a); a.click(); a.remove();
}
render();
</script>
